<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#3730A3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F3F4F6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <rect y="0" width="800" height="60" fill="rgba(255,255,255,0.1)"/>
  <rect x="30" y="15" width="140" height="30" rx="8" fill="white" opacity="0.2"/>
  <text x="100" y="35" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">TaskFlow Pro</text>
  
  <!-- Sidebar -->
  <rect x="0" y="60" width="220" height="390" fill="rgba(255,255,255,0.08)"/>
  <rect x="20" y="90" width="180" height="35" rx="8" fill="#818CF8"/>
  <rect x="20" y="140" width="180" height="35" rx="8" fill="rgba(255,255,255,0.1)"/>
  <rect x="20" y="190" width="180" height="35" rx="8" fill="rgba(255,255,255,0.1)"/>
  <rect x="20" y="240" width="180" height="35" rx="8" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Main Content Area -->
  <rect x="240" y="90" width="530" height="100" rx="12" fill="url(#cardGrad)" filter="url(#dropShadow)"/>
  <rect x="270" y="110" width="60" height="60" rx="10" fill="#DBEAFE"/>
  <circle cx="300" cy="140" r="20" fill="#3B82F6"/>
  <rect x="350" y="120" width="120" height="20" rx="4" fill="#E5E7EB"/>
  <rect x="350" y="150" width="80" height="14" rx="4" fill="#F3F4F6"/>
  
  <rect x="420" y="110" width="60" height="60" rx="10" fill="#D1FAE5"/>
  <circle cx="450" cy="140" r="20" fill="#10B981"/>
  <rect x="500" y="120" width="120" height="20" rx="4" fill="#E5E7EB"/>
  <rect x="500" y="150" width="80" height="14" rx="4" fill="#F3F4F6"/>
  
  <rect x="570" y="110" width="60" height="60" rx="10" fill="#FEF3C7"/>
  <circle cx="600" cy="140" r="20" fill="#F59E0B"/>
  <rect x="650" y="120" width="100" height="20" rx="4" fill="#E5E7EB"/>
  <rect x="650" y="150" width="70" height="14" rx="4" fill="#F3F4F6"/>
  
  <!-- Kanban Preview -->
  <rect x="240" y="210" width="170" height="220" rx="12" fill="url(#cardGrad)" filter="url(#dropShadow)"/>
  <rect x="260" y="230" width="80" height="16" rx="4" fill="#6366F1"/>
  <rect x="260" y="260" width="130" height="12" rx="4" fill="#E5E7EB"/>
  <rect x="260" y="280" width="100" height="10" rx="4" fill="#F3F4F6"/>
  <rect x="260" y="300" width="130" height="35" rx="8" fill="#F3F4F6"/>
  <rect x="260" y="350" width="130" height="35" rx="8" fill="#F3F4F6"/>
  
  <rect x="430" y="210" width="170" height="220" rx="12" fill="url(#cardGrad)" filter="url(#dropShadow)"/>
  <rect x="450" y="230" width="100" height="16" rx="4" fill="#3B82F6"/>
  <rect x="450" y="280" width="130" height="35" rx="8" fill="#F3F4F6"/>
  <rect x="450" y="325" width="130" height="35" rx="8" fill="#F3F4F6"/>
  
  <rect x="620" y="210" width="150" height="220" rx="12" fill="url(#cardGrad)" filter="url(#dropShadow)"/>
  <rect x="640" y="230" width="80" height="16" rx="4" fill="#10B981"/>
  <rect x="640" y="280" width="110" height="35" rx="8" fill="#D1FAE5"/>
  <rect x="640" y="325" width="110" height="35" rx="8" fill="#D1FAE5"/>
  
  <!-- Play Button Overlay -->
  <circle cx="400" cy="225" r="40" fill="rgba(255,255,255,0.9)"/>
  <polygon points="390,205 390,245 430,225" fill="#4F46E5"/>
  
  <!-- Title Text -->
  <text x="400" y="420" font-family="Arial" font-size="32" font-weight="bold" fill="white" text-anchor="middle">TaskFlow Pro v2.0</text>
  <text x="400" y="445" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">إدارة المشاريع الاحترافية - بدون إطار عمل</text>
</svg>
