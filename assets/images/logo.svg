<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#3730A3"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Network Nodes -->
  <g fill="white" opacity="0.9">
    <!-- Center node -->
    <circle cx="100" cy="100" r="12"/>
    
    <!-- Surrounding nodes -->
    <circle cx="100" cy="55" r="7"/>
    <circle cx="140" cy="75" r="7"/>
    <circle cx="140" cy="125" r="7"/>
    <circle cx="100" cy="145" r="7"/>
    <circle cx="60" cy="125" r="7"/>
    <circle cx="60" cy="75" r="7"/>
  </g>
  
  <!-- Connecting Lines -->
  <g stroke="white" stroke-width="2" opacity="0.4">
    <line x1="100" y1="100" x2="100" y2="55"/>
    <line x1="100" y1="100" x2="140" y2="75"/>
    <line x1="100" y1="100" x2="140" y2="125"/>
    <line x1="100" y1="100" x2="100" y2="145"/>
    <line x1="100" y1="100" x2="60" y2="125"/>
    <line x1="100" y1="100" x2="60" y2="75"/>
    
    <!-- Outer connections -->
    <line x1="100" y1="55" x2="140" y2="75"/>
    <line x1="140" y1="75" x2="140" y2="125"/>
    <line x1="140" y1="125" x2="100" y2="145"/>
    <line x1="100" y1="145" x2="60" y2="125"/>
    <line x1="60" y1="125" x2="60" y2="75"/>
    <line x1="60" y1="75" x2="100" y2="55"/>
  </g>
  
  <!-- Checkmark -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="30" fill="white" opacity="0.2"/>
    <path d="M-12 0 L-4 8 L12 -8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="30" cy="30" r="3" fill="white" opacity="0.3"/>
  <circle cx="170" cy="170" r="4" fill="white" opacity="0.4"/>
  <circle cx="175" cy="35" r="2" fill="white" opacity="0.25"/>
  <circle cx="25" cy="165" r="3" fill="white" opacity="0.35"/>
</svg>
