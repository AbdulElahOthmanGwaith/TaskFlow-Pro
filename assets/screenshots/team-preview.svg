    <circle cx="905" cy="380" r="50" fill="#ffe5d0"/>
    <circle cx="905" cy="380" r="40" fill="#fd7e14"/>
    <text x="905" y="385" font-family="Arial" font-size="24" fill="white" text-anchor="middle">س</text>
    <text x="905" y="465" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">سارة علي</text>
    <text x="905" y="490" font-size="14" fill="#fd7e14" text-anchor="middle">مصممة</text>
    <rect x="750" y="430" width="80" height="26" rx="13" fill="#d4edda"/>
    <text x="790" y="448" font-size="11" fill="#155724" text-anchor="middle">38 مكتمل</text>
    <rect x="840" y="430" width="60" height="26" rx="13" fill="#fff3cd"/>
    <text x="870" y="448" font-size="11" fill="#856404" text-anchor="middle">5 قيد</text>
    
    <!-- Member 3 -->
    <rect x="1120" y="310" width="350" height="200" rx="14" fill="white" filter="url(#teamShadow)"/>
    <circle cx="1295" cy="380" r="50" fill="#d4edda"/>
    <circle cx="1295" cy="380" r="40" fill="#28a745"/>
    <text x="1295" y="385" font-family="Arial" font-size="24" fill="white" text-anchor="middle">خ</text>
    <text x="1295" y="465" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">خالد عمر</text>
    <text x="1295" y="490" font-size="14" fill="#28a745" text-anchor="middle">مطور خلفي</text>
    <rect x="1140" y="430" width="80" height="26" rx="13" fill="#d4edda"/>
    <text x="1180" y="448" font-size="11" fill="#155724" text-anchor="middle">52 مكتمل</text>
    <rect x="1230" y="430" width="60" height="26" rx="13" fill="#e9ecef"/>
    <text x="1260" y="448" font-size="11" fill="#6c757d" text-anchor="middle">2 قيد</text>
    
    <!-- Member 4 -->
    <rect x="1510" y="310" width="350" height="200" rx="14" fill="white" filter="url(#teamShadow)"/>
    <circle cx="1685" cy="380" r="50" fill="#f3e8ff"/>
    <circle cx="1685" cy="380" r="40" fill="#9333ea"/>
    <text x="1685" y="385" font-family="Arial" font-size="24" fill="white" text-anchor="middle">ن</text>
    <text x="1685" y="465" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">نورة سعيد</text>
    <text x="1685" y="490" font-size="14" fill="#9333ea" text-anchor="middle">مديرة مشروع</text>
    <rect x="1530" y="430" width="80" height="26" rx="13" fill="#d4edda"/>
    <text x="1570" y="448" font-size="11" fill="#155724" text-anchor="middle">31 مكتمل</text>
    <rect x="1620" y="430" width="60" height="26" rx="13" fill="#fff3cd"/>
    <text x="1650" y="448" font-size="11" fill="#856404" text-anchor="middle">4 قيد</text>
    
    <!-- Member 5 -->
    <rect x="340" y="540" width="350" height="200" rx="14" fill="white" filter="url(#teamShadow)"/>
    <circle cx="515" cy="610" r="50" fill="#ffe5d0"/>
    <circle cx="515" cy="610" r="40" fill="#dc3545"/>
    <text x="515" y="615" font-family="Arial" font-size="24" fill="white" text-anchor="middle">ع</text>
    <text x="515" y="695" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">عمر فهد</text>
    <text x="515" y="720" font-size="14" fill="#dc3545" text-anchor="middle">محلل بيانات</text>
    <rect x="360" y="660" width="80" height="26" rx="13" fill="#d4edda"/>
    <text x="400" y="678" font-size="11" fill="#155724" text-anchor="middle">28 مكتمل</text>
    <rect x="450" y="660" width="60" height="26" rx="13" fill="#e9ecef"/>
    <text x="480" y="678" font-size="11" fill="#6c757d" text-anchor="middle">1 قيد</text>
    
    <!-- Member 6 -->
    <rect x="730" y="540" width="350" height="200" rx="14" fill="white" filter="url(#teamShadow)"/>
    <circle cx="905" cy="610" r="50" fill="#e8f2fc"/>
    <circle cx="905" cy="610" r="40" fill="#17a2b8"/>
    <text x="905" y="615" font-family="Arial" font-size="24" fill="white" text-anchor="middle">ل</text>
    <text x="905" y="695" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">لينا حسن</text>
    <text x="905" y="720" font-size="14" fill="#17a2b8" text-anchor="middle">كاتبة محتوى</text>
    <rect x="750" y="660" width="80" height="26" rx="13" fill="#d4edda"/>
    <text x="790" y="678" font-size="11" fill="#155724" text-anchor="middle">22 مكتمل</text>
    <rect x="840" y="660" width="60" height="26" rx="13" fill="#fff3cd"/>
    <text x="870" y="678" font-size="11" fill="#856404" text-anchor="middle">3 قيد</text>
  </g>
  
  <!-- Footer -->
  <text x="960" y="1050" font-family="Cairo, Arial" font-size="12" fill="#adb5bd" text-anchor="middle">TaskFlow Pro v2.0 - إدارة الفريق</text>
</svg>
